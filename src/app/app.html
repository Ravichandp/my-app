
<mat-sidenav-container class="app-container">
  <mat-sidenav #drawer class="app-drawer" mode="over">
    <div class="drawer-header">
      <span>Angular Panels</span>
      <button mat-icon-button type="button" aria-label="Close navigation drawer" (click)="drawer.close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <mat-nav-list>
      <a mat-list-item href="#event">Event</a>
      <a mat-list-item href="#button">Button</a>
      <a mat-list-item href="#input">Input</a>
      <a mat-list-item href="#ifelse">If Else</a>
      <a mat-list-item href="#switch">Switch Case</a>
      <a mat-list-item href="#forloop">For Loop</a>
      <a mat-list-item href="#signals">Signals</a>
      <a mat-list-item href="#effects">Effects</a>
      <a mat-list-item href="#pipes">Pipes</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button type="button" aria-label="Open navigation drawer" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Angular Demo Panels</span>
    </mat-toolbar>

    <main class="app-grid">
      <section id="event" class="div-section"><app-event/></section>
      <section id="button" class="div-section"><app-buttonclick/></section>
      <section id="input" class="div-section"><app-getsetinput/></section>
      <section id="ifelse" class="div-section"><app-ifelse/></section>
      <section id="switch" class="div-section"><app-switchcase/></section>
      <section id="forloop" class="div-section"><app-forloop/></section>
      <section id="signals" class="div-section"><app-signals/></section>
      <section id="effects" class="div-section"><app-effects/></section>
      <section id="pipes" class="div-section"><app-pipes/></section>
       <section id="pipes" class="div-section"><app-todo/></section>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
